name: CI

# tr#(fsg-common adoption, 5 Sep 2026): the package had no CI at all --
# `git log --oneline` shows three commits and zero workflow runs. A shared
# package with no CI, that two repos are about to depend on and delete their
# own copies in favour of, is a single point of failure for both. This is the
# prerequisite the adoption work names as Phase 0, added before anything
# imports the package.
#
# Two jobs: `checks` (ruff) and `tests` (pytest, on both OSes this package's
# eventual consumers run on). GitHub-hosted runners (crm#1792, 1 Oct 2026):
# this repository is public, so its pull_request jobs must not run on
# self-hosted runners. Hosted minutes are free for public repositories.
#
# `tools/parity_report.py` deliberately does NOT run here. It needs both
# sibling repos checked out at a pinned ref, which a private-repo checkout
# from this workflow cannot do without a cross-repo credential this repo does
# not have -- the same gap `fsg-tender-review`'s own `check_twin_parity.py`
# has in its CI (`tr#281`). It runs locally, where every dev machine for this
# project has the siblings checked out, per its own docstring.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: pip install ".[dev]"

      - name: ruff check
        run: ruff check .

      - name: The compulsory reading path stays under 30,500 words
        # crm#557/crm#635, and the estate-wide rollout of 19 Sep 2026: a doc
        # edit in ANY of the five repos can push the shared total over the
        # cap, and until now only fsg-estimating-crm's own CI re-measured
        # it -- so a change here could turn crm's PRs red without this
        # repo's own CI ever going red for the same reason. Same script,
        # same credential, same rule in all five repos now; this is
        # fsg-common's own copy (`fsg_common.reading_path` is also the
        # shared implementation the other four repos' wrappers call).
        #
        # `FSG_COMMON_PAT` is not yet a secret on THIS repo -- four of the
        # six files live in private repos this workflow's own GITHUB_TOKEN
        # cannot read, so until the secret is added this step REFUSES
        # (exit 2) rather than silently passing on a total that only ever
        # counted this repo's own CLAUDE.md. That refusal is the point:
        # "a check that cannot read its inputs must refuse, not pass" is
        # this estate's own rule, and it applies to this gate first.
        if: '!cancelled()'
        env:
          FSG_COMMON_PAT: ${{ secrets.FSG_COMMON_PAT }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python scripts/check_reading_path_word_count.py

      - name: docs/COMMANDS.md matches the code (task-to-command index)
        # Fails this job on a miss, on David's decision of 10 Sep 2026 --
        # not merge-blocking: branch protection here has no required checks
        # (tr#656), so this only turns the job red. The index answers
        # "I know the task, not the tool's name -- what do I run?", which the
        # rationale-ordered docs cannot. It is generated, so it can only stay
        # true if something checks it.
        #
        # It catches two failures. The index no longer matches the code, or a
        # command nobody has filed under a task group in
        # scripts/commands_index.json. The second is the point: the grouping
        # cannot be derived, so a new command cannot land until someone says
        # which task it serves. Filing it is one line.
        #
        # Stdlib ast plus git ls-files, nothing installed. --selftest is its
        # own positive control: it injects a subcommand into a throwaway clone
        # and reports the exit code, because a check never observed failing is
        # not a check.
        run: python scripts/gen_commands_index.py --check

  tests:
    # Linux only, deliberately -- dropped the Windows leg 5 Sep 2026 rather
    # than leave it declared and permanently unpickupable. `truenas-win10-vm`
    # (the `fsg-windows` label) is a separate machine neither this session
    # nor its coordinator has access to register a runner on, so a declared
    # Windows leg here would sit `pending` forever, which is a worse failure
    # mode than not having it: an absent check that reads as a stalled one
    # rather than a missing one.
    #
    # RESTORE CONDITION, so this is a decision with a trigger and not a gate
    # that quietly stopped existing: this package's only path handling today
    # is `__file__`-derived (`substitutions.py`, `_snapshot.py`), which ADR 14
    # (fsg-tender-review/CLAUDE.md) says keeps host semantics and must not be
    # "fixed" -- there is nothing here a Windows-vs-Linux path difference
    # could currently expose. The moment this package absorbs anything that
    # parses a path or an identifier OUT OF DATA rather than deriving one from
    # `__file__` -- quote identity / `canon_quote` is the named Phase 2
    # candidate -- add the Windows leg back before merging that change, not
    # after.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: pip install ".[dev]"

      - name: Tests
        run: PYTHONPATH=src pytest -q
